# Mises à jour groupées, vérifiées chaque jour, proposées sur la branche dev (main ne reçoit que les
# releases), sans délai d'attente : le délai de 3 jours appliqué par défaut aux mises à jour de
# version est levé pour toutes les dépendances (cooldown.exclude, 0 jour n'étant pas une valeur admise).
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/web"]
    target-branch: dev
    cooldown:
      exclude: ["*"]
    schedule:
      interval: daily
    ignore:
      # Version exacte, liée à wasm-bindgen-cli (Dockerfile, CI, CONTRIBUTING) : à monter ensemble.
      - dependency-name: wasm-bindgen
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    cooldown:
      exclude: ["*"]
    schedule:
      interval: daily
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    cooldown:
      exclude: ["*"]
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns: ["*"]
