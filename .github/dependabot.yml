# Mises à jour groupées, vérifiées chaque jour, sans délai d'attente, proposées sur la branche dev
# (main ne reçoit que les releases).
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/web"]
    target-branch: dev
    schedule:
      interval: daily
    ignore:
      # Version exacte, liée à wasm-bindgen-cli (Dockerfile, CI, CONTRIBUTING) : à monter ensemble.
      - dependency-name: wasm-bindgen
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: daily
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns: ["*"]
