# Fusion automatique dans dev, quand tous les contrôles obligatoires passent :
# - PR d'un robot (Dependabot…) : la CI suffit, CodeRabbit ne relit pas les robots ;
# - PR du mainteneur : il faut EN PLUS que CodeRabbit ait réellement relu le commit de tête : son
#   check run sur ce commit conclut « success » avec « Review completed ». Une revue sautée (filtres
#   de chemins, quota, erreur) conclut « skipped », qui compte comme passé parmi les contrôles :
#   l'état des contrôles seul ne suffit donc pas ; une revue sans remarque ne publie aucune revue de
#   PR, on ne peut donc pas non plus compter les revues. Sans vraie revue, la PR reste ouverte et
#   une revue est redemandée une seule fois, 45 minutes après des contrôles verts. Chaque remarque
#   de CodeRabbit doit aussi être résolue (corrigée, ou répondue et marquée résolue) : une seule
#   remarque ouverte garde la PR ouverte.
# Un contrôle en échec laisse la PR ouverte. Les mises à jour de sécurité de Dependabot visent
# toujours main : elles sont déplacées sur dev.
#
# Une fusion faite avec GITHUB_TOKEN ne lance aucun workflow de push : la tâche lance elle-même la
# publication de l'image :dev.
name: Fusion automatique

on:
  pull_request:
    branches: [dev, main]
    # `edited` couvre une base changée vers dev après l'ouverture.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  automerge:
    name: fusion automatique
    if: >-
      github.event.pull_request.draft == false &&
      (github.event_name == 'pull_request' ||
       github.event.review.user.login == 'coderabbitai[bot]') &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
       (github.event.pull_request.base.ref == 'dev' &&
        (github.event.pull_request.user.type == 'Bot' ||
         github.event.pull_request.user.login == github.repository_owner)))
    runs-on: ubuntu-24.04
    # La CI peut durer jusqu'à 120 minutes, puis jusqu'à 90 minutes d'attente de la revue.
    timeout-minutes: 240
    # Au niveau de la tâche : une exécution dont la tâche est sautée (revue humaine) ne doit pas
    # annuler la boucle en cours.
    concurrency:
      group: automerge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      actions: write
      # Lus par `gh pr checks` (check runs et statuts de commit).
      checks: read
      statuses: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      ROBOT: ${{ github.event.pull_request.user.type == 'Bot' }}
    steps:
      - name: Mise à jour de sécurité déplacée sur dev
        if: github.event.pull_request.base.ref == 'main'
        run: |
          gh pr edit "$PR" --base dev
          gh workflow run ci.yml --ref "$HEAD_REF"

      - name: Fusion quand les contrôles passent et que CodeRabbit a relu, puis image :dev
        run: |
          tete=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          marque='<!-- fusion automatique : revue redemandée -->'
          attente=0
          relu=0
          anterieurs_lus=0
          # Jusqu'à la fin des contrôles (le délai de la tâche borne une CI sans fin), puis 90 minutes.
          while :; do
            etat=$(gh pr view "$PR" --json state,headRefOid --jq '.state + " " + .headRefOid')
            # Fusionnée, fermée, ou un commit plus récent (sa propre exécution prend le relais).
            if [ "$etat" != "OPEN $tete" ]; then exit 0; fi
            controles=$(gh pr checks "$PR" --required --json bucket --jq '
              if any(.[]; .bucket == "fail" or .bucket == "cancel") then "echec"
              elif length > 0 and all(.[]; .bucket == "pass" or .bucket == "skipping") then "vert"
              else "attente" end' || true)
            if [ "$controles" = echec ]; then exit 0; fi
            if [ "$controles" = vert ]; then
              revues=1
              ouvertes=0
              if [ "$ROBOT" != true ]; then
                # Une vraie revue, une fois vue, vaut pour toute l'exécution (une tête plus récente
                # y met fin), et les commits antérieurs sont lus une seule fois (leurs check runs ne
                # changent plus) : la boucle reste dans le quota de requêtes de GITHUB_TOKEN.
                if [ "$relu" != 1 ]; then
                  n=$(gh api "repos/$GH_REPO/commits/$tete/check-runs?check_name=CodeRabbit" --jq '
                    [.check_runs[] | select(.app.slug == "coderabbitai" and .conclusion == "success"
                      and ((.output.summary // "") | contains("Review completed")))] | length' || echo 0)
                  if [ "$n" -gt 0 ]; then relu=1; fi
                fi
                # Une tête qui ne fait qu'apporter dev est « Skipped - No files to review » : rien
                # de neuf pour CodeRabbit, donc une vraie revue d'un commit antérieur de la PR vaut.
                if [ "$relu" != 1 ] && [ "$anterieurs_lus" != 1 ] &&
                  gh api "repos/$GH_REPO/commits/$tete/check-runs?check_name=CodeRabbit" \
                    --jq '.check_runs[] | select(.app.slug == "coderabbitai") | .output.summary // ""' |
                  grep -qF "No files to review"; then
                  # Marquée lue seulement si toutes les lectures ont réussi : une lecture en échec
                  # est retentée au passage suivant, jamais prise pour « aucune revue ».
                  lecture_ok=1
                  commits=$(gh api "repos/$GH_REPO/pulls/$PR/commits" --paginate --jq '.[].sha') || lecture_ok=0
                  for c in $commits; do
                    n=$(gh api "repos/$GH_REPO/commits/$c/check-runs?check_name=CodeRabbit" --jq '
                      [.check_runs[] | select(.app.slug == "coderabbitai" and .conclusion == "success"
                        and ((.output.summary // "") | contains("Review completed")))] | length') ||
                      { lecture_ok=0; continue; }
                    if [ "$n" -gt 0 ]; then relu=1; break; fi
                  done
                  if [ "$lecture_ok" = 1 ]; then anterieurs_lus=1; fi
                fi
                revues=$relu
                # Remarques de CodeRabbit encore ouvertes (fils non résolus qu'il a lancés) ; une
                # requête en échec, ou plus de 100 fils qui en laissent de non lus, comptent pour une :
                # une erreur ou une lecture partielle ne fusionne jamais.
                ouvertes=$(gh api graphql -F owner="${GH_REPO%/*}" -F name="${GH_REPO#*/}" -F pr="$PR" -f query='
                  query($owner: String!, $name: String!, $pr: Int!) {
                    repository(owner: $owner, name: $name) {
                      pullRequest(number: $pr) {
                        reviewThreads(first: 100) {
                          pageInfo { hasNextPage }
                          nodes { isResolved comments(first: 1) { nodes { author { login } } } }
                        }
                      }
                    }
                  }' --jq '.data.repository.pullRequest.reviewThreads
                    | if .pageInfo.hasNextPage then 1 else [.nodes[]
                      | select((.isResolved | not) and .comments.nodes[0].author.login == "coderabbitai")]
                      | length end' || echo 1)
              fi
              if [ "$revues" -gt 0 ] && [ "$ouvertes" -eq 0 ]; then
                gh pr merge "$PR" --merge --match-head-commit "$tete"
                gh workflow run dev-image.yml --ref dev
                exit 0
              fi
              # Pas de vraie revue 45 minutes après des contrôles verts : la redemander une seule
              # fois pour cette PR, jamais plus (la commande doit être seule sur sa ligne), et
              # l'attendre encore 45 minutes. Des remarques ouvertes attendent les mêmes 90 minutes
              # que leurs fils soient résolus ; ensuite, un nouveau commit ou une relance prend le relais.
              attente=$((attente + 1))
              if [ "$revues" -eq 0 ] && [ "$attente" -eq 90 ] &&
                ! gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq '.[].body' | grep -qF "$marque"; then
                gh pr comment "$PR" --body "$(printf '@coderabbitai review\n\n%s' "$marque")"
              fi
              if [ "$attente" -ge 180 ]; then exit 0; fi
            fi
            sleep 30
          done
